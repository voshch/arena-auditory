[project]
name = "arena_auditory"
version = "0.0.0"
dependencies = [
    "attrs",
    "matplotlib",
    "mcap",
    "mcap-ros2-support",
    "numpy",
    "pillow",
    "polars",
    "pyarrow",
    "pyroomacoustics>=0.10.1",
    "pyyaml",
    "scipy",
    "shapely",
    "sounddevice>=0.5.5",
]
dynamic = ["description", "license", "maintainers", "scripts"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ros: requires a sourced ROS2 environment",
    "slow: long-running tests",
]
